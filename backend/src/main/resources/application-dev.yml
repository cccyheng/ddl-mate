# =====================================================================
# 开发 / 演示 profile：H2 file 模式，无需本机安装任何数据库
# 数据文件落在项目 data/ 目录，重启后数据保留（刷新后数据不丢）
# 启动：mvn -f backend/pom.xml spring-boot:run -Dspring-boot.run.profiles=dev
# =====================================================================
spring:
  datasource:
    url: jdbc:h2:file:./data/ddlmate-dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: ${DDLMATE_H2_USER:sa}
    password: ${DDLMATE_H2_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

logging:
  level:
    com.ddlmate: DEBUG
