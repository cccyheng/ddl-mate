# =====================================================================
# DDL Mate 后端默认配置
# 业务时区固定 Asia/Shanghai；时间 API 格式见 docs/implementation-plan.md §4
# 所有值都可用同名大写环境变量覆盖，例如 DDLMATE_TIME_ZONE
# =====================================================================
spring:
  application:
    name: ddl-mate
  jackson:
    # 时间统一按业务时区输出，例如 2026-10-15T10:10:00+08:00
    time-zone: ${DDLMATE_TIME_ZONE:Asia/Shanghai}
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        # 时间列统一按 UTC 写入数据库，读取时再转回业务时区。
        # 注意：必须放在 spring.jpa.properties.hibernate.* 下，
        # 写成 spring.jpa.hibernate.jdbc.time_zone 不会被 Hibernate 识别。
        jdbc:
          time_zone: UTC
        format_sql: false
  servlet:
    multipart:
      max-file-size: ${DDLMATE_MAX_FILE_SIZE:5MB}
      max-request-size: ${DDLMATE_MAX_REQUEST_SIZE:20MB}

server:
  address: ${DDLMATE_BIND_ADDRESS:127.0.0.1}
  port: ${DDLMATE_SERVER_PORT:8080}
  servlet:
    session:
      # 登录会话：7 天不操作才过期；Cookie 只给本站、脚本读不到
      timeout: ${DDLMATE_SESSION_TIMEOUT:7d}
      cookie:
        name: DDLMATE_SESSION
        http-only: true
        same-site: strict
        # 部署在 HTTPS 后面时设为 true
        secure: ${DDLMATE_COOKIE_SECURE:false}
  error:
    include-message: always
    include-binding-errors: always

ddlmate:
  time-zone: ${DDLMATE_TIME_ZONE:Asia/Shanghai}
  storage:
    # 附件落盘目录（服务器生成文件名，防路径穿越）
    upload-dir: ${DDLMATE_UPLOAD_DIR:./data/uploads}
    max-file-size: ${DDLMATE_MAX_FILE_SIZE:5MB}
    allowed-content-types: image/png,image/jpeg,image/webp,image/gif
  auth:
    # 单人登录。默认关闭（只在本机 127.0.0.1 使用）；部署到服务器必须开启，
    # 密码只配置 PBKDF2 哈希：node scripts/hash-password.mjs 生成
    enabled: ${DDLMATE_AUTH_ENABLED:false}
    username: ${DDLMATE_AUTH_USERNAME:}
    password-hash: ${DDLMATE_AUTH_PASSWORD_HASH:}
    # 一次性设置码（可选）：配置后可在 /setup 页面设置密码，网页设置的密码优先；用完删除
    setup-token: ${DDLMATE_AUTH_SETUP_TOKEN:}
    # 开放注册（多用户）：每个账号的数据相互隔离；限流防止被批量注册
    registration-enabled: ${DDLMATE_AUTH_REGISTRATION_ENABLED:false}
    registrations-per-ip-per-hour: ${DDLMATE_AUTH_REGISTRATIONS_PER_IP_PER_HOUR:3}
    registrations-per-day: ${DDLMATE_AUTH_REGISTRATIONS_PER_DAY:30}
    # 连续登录失败多少次后，同一来源锁定多少秒
    max-failures: ${DDLMATE_AUTH_MAX_FAILURES:5}
    lock-seconds: ${DDLMATE_AUTH_LOCK_SECONDS:300}
  # 每个账号的用量上限
  quota:
    max-tasks: ${DDLMATE_QUOTA_MAX_TASKS:5000}
    max-courses: ${DDLMATE_QUOTA_MAX_COURSES:200}
    max-storage-mb: ${DDLMATE_QUOTA_MAX_STORAGE_MB:100}
  # 每晚自动备份（数据库导出 + 图片打包，保留 N 天）；服务器版在 application-prod.yml 里默认开启
  backup:
    nightly:
      enabled: ${DDLMATE_BACKUP_NIGHTLY:false}
      cron: ${DDLMATE_BACKUP_CRON:0 0 3 * * *}
      retention-days: ${DDLMATE_BACKUP_RETENTION_DAYS:14}
  user:
    # 本地资料（显示名等），与上面的登录账号是两回事
    username: ${DDLMATE_USER_NAME:local}
    display-name: ${DDLMATE_USER_DISPLAY_NAME:本机同学}

logging:
  level:
    root: INFO
    com.ddlmate: INFO
