# DDL Mate：Nginx 站点配置（安装到 /etc/nginx/sites-available/ddlmate 并软链到 sites-enabled）
# 证书：Let's Encrypt 签给 IP 的短期证书（约 6 天），certbot 自动续期后 reload nginx。
# __SERVER_IP__ 由部署时替换成服务器公网 IP。

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 证书签发 / 续期校验
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Ubuntu 24.04 自带 nginx 1.24：还不支持单独的 "http2 on;"（1.25.1 起），用 listen 参数
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 备份恢复会上传整库 JSON（含图片），留足余量
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
